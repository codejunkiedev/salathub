<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="SalatHub turns any TV or tablet into a prayer-time display for your masjid. Manage iqamah times, announcements and events from one console."
    />
    <meta name="theme-color" content="#047857" />
    <meta property="og:site_name" content="SalatHub" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://salathub.alkhairia.org/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="SalatHub: prayer times and notices on every screen in your masjid"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "SalatHub",
        "url": "https://salathub.alkhairia.org/",
        "applicationCategory": "BusinessApplication",
        "operatingSystem": "Web",
        "description": "Digital prayer-time and announcement screens for masjids, managed from one web console."
      }
    </script>

    <!-- Apply the saved theme before first paint so pre-rendered pages don't flash. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('prayerbox-ui-theme') || 'system';
          if (t === 'system')
            t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          document.documentElement.classList.add(t);
        } catch (e) {}
      })();
    </script>
    <!--
      The loading screen is styled here rather than by the app's stylesheet so
      it looks right before that stylesheet arrives (in dev, Vite loads it
      through JavaScript). src/pages/loading-page.tsx uses the same classes.
    -->
    <style>
      html {
        background: #fff;
      }
      html.dark {
        background: #0a0a0a;
      }
      #prerender ~ #root {
        display: none;
      }

      .splash {
        --splash-fg: #0a0a0a;
        --splash-muted: #737373;
        --splash-track: #e5e5e5;
        --splash-accent: #059669;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        min-height: 100dvh;
        background: #fff;
        color: var(--splash-fg);
        font-family: Poppins, ui-sans-serif, system-ui, sans-serif;
      }
      html.dark .splash {
        --splash-fg: #fafafa;
        --splash-muted: #a1a1a1;
        --splash-track: #262626;
        --splash-accent: #10b981;
        background: #0a0a0a;
      }
      /* Spaced with gap: the base-style fallback for old TV browsers resets margin and padding with higher specificity. */
      .splash-inner {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1.75rem;
        text-align: center;
      }
      .splash-brand {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1.25rem;
      }
      .splash-progress {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.875rem;
      }
      .splash-logo {
        position: relative;
        width: 4.5rem;
        height: 4.5rem;
      }
      .splash-logo::before {
        content: '';
        position: absolute;
        inset: -1.75rem;
        border-radius: 9999px;
        background: radial-gradient(closest-side, rgb(16 185 129 / 0.22), transparent);
        animation: splash-breathe 2.4s ease-in-out infinite;
      }
      .splash-logo img {
        position: relative;
        display: block;
        width: 100%;
        height: 100%;
      }
      .splash-title {
        font-size: 1.5rem;
        line-height: 2rem;
        font-weight: 600;
        letter-spacing: -0.01em;
      }
      .splash-track {
        position: relative;
        width: 12rem;
        height: 0.25rem;
        overflow: hidden;
        border-radius: 9999px;
        background: var(--splash-track);
      }
      .splash-fill {
        position: relative;
        height: 100%;
        overflow: hidden;
        border-radius: 9999px;
        background: var(--splash-accent);
        transition: width 0.5s ease-out;
      }
      /* The fill shows real progress; the sweep shows work is still going on. */
      .splash-fill::after {
        content: '';
        position: absolute;
        inset: 0;
        transform: translateX(-100%);
        background: linear-gradient(90deg, transparent, rgb(255 255 255 / 0.5), transparent);
        animation: splash-sweep 1.4s ease-in-out infinite;
      }
      .splash-step {
        min-height: 1.25rem;
        font-size: 0.8125rem;
        line-height: 1.25rem;
        color: var(--splash-muted);
      }
      @keyframes splash-breathe {
        50% {
          opacity: 0.45;
          transform: scale(0.92);
        }
      }
      @keyframes splash-sweep {
        to {
          transform: translateX(100%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .splash-logo::before,
        .splash-fill::after {
          animation: none;
        }
      }
    </style>

    <!--
    Service worker recovery. Runs before any bundled module so that even if a
    stale SW serves a cached index.html with broken asset hashes, admin users
    still escape the cache instead of seeing a blank screen.
  -->
    <script>
      (function () {
        var displayPaths = ['/', '/display', '/logout', '/login-with-code'];
        if (displayPaths.indexOf(window.location.pathname) !== -1) return;
        if (!('serviceWorker' in navigator)) return;
        navigator.serviceWorker.getRegistrations().then(function (regs) {
          if (!regs.length) return;
          Promise.all(
            regs.map(function (r) {
              return r.unregister();
            })
          )
            .then(function () {
              if ('caches' in window) {
                return caches.keys().then(function (keys) {
                  return Promise.all(
                    keys.map(function (k) {
                      return caches.delete(k);
                    })
                  );
                });
              }
            })
            .then(function () {
              window.location.reload();
            });
        });
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Poppins -->
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400..700&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />

    <title>SalatHub</title>
  </head>

  <body>
    <div id="root">
      <div class="splash">
        <div class="splash-inner">
          <div class="splash-brand">
            <div class="splash-logo"><img src="/icons/icon-192.png" alt="" /></div>
            <div class="splash-title">SalatHub</div>
          </div>
          <div class="splash-progress">
            <div role="progressbar" aria-label="Loading" class="splash-track">
              <div class="splash-fill" style="width: 10%"></div>
            </div>
            <p class="splash-step" role="status">Loading SalatHub</p>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
